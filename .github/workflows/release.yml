name: Release

# Driven by publishing a GitHub Release rather than by pushing a tag: the release is the
# moment a human decided the artefacts are worth keeping, and coordinates on Central are
# permanent, so the trigger has to be something deliberate.
on:
  release:
    types: [published]
  # Lets a run be retried by hand after a partial failure.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The signing key and the Central token live on this environment, which is restricted to
    # v* tags. A job that does not declare the environment receives empty strings for those
    # secrets rather than an error, so this line is what actually gates them.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          # A release event checks out the default branch unless told otherwise, which would
          # publish whatever version happens to be on main instead of the released one.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Check the declared version
        run: |
          declared="$(sed -n 's/^groovyfmtVersion=//p' gradle.properties)"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$declared" ]; then
              echo "::error::tag '$tag' does not match groovyfmtVersion '$declared'"
              exit 1
            fi
          fi
          echo "releasing $declared"

      # The build pins itself on an already-published formatter and falls back to a bootstrap
      # mode when ~/.m2 is empty. Bootstrap skips Spotless entirely -- and therefore the
      # importOrder check -- so on a fresh runner the gate would silently be weaker than it
      # looks. Publishing the formatter locally first keeps the real gate. This mirrors what
      # ci.yml does, for the same reason.
      - name: Publish formatter to the local Maven repository
        run: ./gradlew publishFormatter

      - name: Check (tests + CodeNarc + SpotBugs + Spotless self-check)
        run: ./gradlew check

      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # The Portal reviews first submissions by hand. Days of silence here are expected, not
      # a failure -- check the plugin's status page before re-running anything.
      - name: Publish the plugin to the Gradle Plugin Portal
        run: ./gradlew :groovyfmt-gradle-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
