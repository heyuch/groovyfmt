name: CI

on:
  push:
  pull_request:

# 同一分支被连续推送时，取消尚未跑完的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 自举需要"本地仓库里已发布的 formatter"。
      #
      # CI 上 ~/.m2 是空的，构建会【自动进入引导模式】—— 那能跑通构建，但引导模式
      # 会跳过 Spotless（因此也跳过 importOrder 检查），而且此时直接调用 spotless 任务
      # 会失败（Spotless 块根本没被配置）。
      #
      # 所以这里先自我发布一次，再跑完整闸门。这与开发者本地的流程一致，
      # 也顺带在 CI 上验证了"发布 → 用已发布版本自举"这条链路。
      #
      # 未来接入真实仓库后，这一步可以换成"从 Maven Central 解析已发布的
      # formatterToolVersion"，那时才真正验证了"开发中的实现"与"自用实现"的隔离。
      - name: Publish formatter to the local Maven repository
        run: ./gradlew publishFormatter

      - name: Check (tests + CodeNarc + Spotless self-check)
        run: ./gradlew check

      # 测试是自研跑器，直接打印到 stdout —— 失败信息就在上面的日志里。
      # 这里额外留下 CodeNarc 报告，方便定位违规。
      - name: Upload CodeNarc reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codenarc-reports
          path: '**/build/reports/codenarc/'
          if-no-files-found: ignore
