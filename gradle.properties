# 集中管理版本，方便升级
groovyVersion=4.0.30
# CodeNarc 的 Groovy 4 专用发行版（普通版面向 Groovy 3）
codenarcVersion=3.7.0-groovy-4.0

# Spotless 步骤接口（spotless-lib 与 Gradle 插件版本需对应）
spotlessLibVersion=4.10.2

# ── 两个刻意分开的版本号 ──
# groovyfmtVersion      正在构建/发布的版本
# formatterToolVersion  用来【格式化本工程自己】的那个"已发布且成熟"的版本
#
# 为什么必须分开：如果共用一个属性，pin 就会自动指向"还没发布的版本"，
# pin 的意义（把开发中的实现与自用实现解耦）就消失了。
groovyfmtVersion=0.1.0
formatterToolVersion=0.1.0

# Spotless 的 Gradle 插件本身（插件模块只在编译期需要）
spotlessPluginVersion=8.10.2
