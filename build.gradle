// groovyfmt —— 根聚合工程：下发公共配置 + 自举格式检查 + 聚合任务
//
// 背景（Groovy 3/4 类加载器冲突、自举与版本固定、引导模式）见 README「自举与版本固定」。

// 步骤类必须在构建脚本的 classpath 上，所以用 buildscript 而不是 custom 的隐式引用。
// 本地仓库里还没有已发布版本时（典型场景：刚 clone）进入引导模式。
buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        def toolVersion = project.property('formatterToolVersion')
        String groupId = project.property('projectGroup')
        def m2Root = new File(System.getProperty('user.home'), '.m2/repository')
        // 仓库布局路径由 group 派生（点换成斜杠）—— 不要写死，见 gradle.properties 的说明
        String m2Path = groupId.replace('.', '/')
        def pinned = { String id ->
            new File(m2Root, "${m2Path}/${id}/${toolVersion}/${id}-${toolVersion}.jar").isFile()
        }
        boolean boot = project.hasProperty('bootstrapFormatter') ||
                !(pinned('groovyfmt-core') && pinned('groovyfmt-spotless'))
        project.ext.bootstrapMode = boot
        if (boot) {
            // 不声明依赖：否则配置期解析不到 artifact 会失败，连 publishToMavenLocal 都跑不起来
            project.logger.lifecycle('groovyfmt: 本地仓库没有已发布的 formatter → 引导模式')
        } else {
            classpath "${groupId}:groovyfmt-spotless:${toolVersion}"
        }
    }
}

plugins {
    id 'base'
    id 'com.diffplug.spotless' version '8.10.2'
    // 字节码级静态分析：Groovy 也能用（SpotBugs 分析 .class），源码级语义规则另有 CodeNarc。
    // apply false + subprojects 里 apply：版本号只在一处声明。
    id 'com.github.spotbugs' version '6.5.13' apply false
}

// subprojects{} 是"跨工程配置"，规模变大、或各 module 需要不同配置子集时再换 convention plugin。
subprojects { sub ->
    // 每个模块的 POM description —— Central 要求 description 非空
    def moduleDescriptions = [
            'groovyfmt-core'         : 'The groovyfmt formatter itself: tokens/CST, rules, arbitration and rendering, plus a CLI',
            'groovyfmt-spotless'     : 'Spotless adapter that runs groovyfmt through an isolated classloader',
            'groovyfmt-gradle-plugin': 'Gradle plugin that wires groovyfmt into the Spotless groovy DSL',
            'groovyfmt-codenarc'     : 'CodeNarc rules that keep formatting rules from being exempted',
    ]

    apply plugin: 'groovy'
    apply plugin: 'codenarc'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    group = project.property('projectGroup')
    version = groovyfmtVersion

    // 取成本地变量再用：POM 元数据写在嵌套的 pom{} 闭包里，那里 project 会顺着
    // owner 链落到 root 工程上，project.name 就不再是本模块的名字了。
    def moduleName = sub.name
    def moduleCoordinates = "${group}:${moduleName}"

    repositories {
        mavenCentral()
    }

    java {
        // toolchain 而不只是 release/targetCompatibility：它决定编译器能看见哪些 JDK API。
        // 只钉字节码等级的话，Groovy 源码可以在更新的 JDK 上悄悄用上更新的 API
        // （options.release 只约束 .java），产出的 jar 要到使用者的机器上才会炸。
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        // Central 强制要求每个构件都带 -sources.jar 与 -javadoc.jar，缺一个 bundle 就校验失败。
        // 本仓库 main 源码全是 Groovy，而 javadoc 任务只处理 .java ⇒ javadoc jar 内容近乎为空。
        // 校验只要求文件存在，所以能过；要用 groovydoc 填内容需另行配置。
        withSourcesJar()
        withJavadocJar()
    }

    // publishToMavenLocal == mvn install（装到 ~/.m2/repository）
    //
    // ':groovyfmt-gradle-plugin' 必须排除：java-gradle-plugin 已经自建了 pluginMaven
    // publication，坐标与这里要建的 maven publication 完全相同
    // （io.github.heyuch:groovyfmt-gradle-plugin:<version>）。两个一起进 Central 的
    // bundle 会出现重复路径，校验直接失败。
    //
    // 只能按路径判断，不能问 plugins.hasPlugin('java-gradle-plugin')：subprojects{}
    // 在 root 求值期就执行，那时该模块自己的 build.gradle 还没被读取，插件尚未应用。
    if (sub.path != ':groovyfmt-gradle-plugin') {
        publishing {
            publications {
                maven(MavenPublication) {
                    from components.java
                }
            }
        }
    }

    // 给本模块【所有】publication 补 Central 要求的四段元数据。用 configureEach 而不是
    // 直接引用：插件模块的 publication 由 java-gradle-plugin 在更晚的时候创建。
    publishing.publications.configureEach { pub ->
        pub.pom {
            name = moduleCoordinates
            description = moduleDescriptions[moduleName]
            url = 'https://github.com/heyuch/groovyfmt'
            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'heyuch'
                    name = 'yuchuan.he'
                    url = 'https://github.com/heyuch'
                }
            }
            scm {
                url = 'https://github.com/heyuch/groovyfmt'
                connection = 'scm:git:https://github.com/heyuch/groovyfmt.git'
                developerConnection = 'scm:git:ssh://git@github.com/heyuch/groovyfmt.git'
            }
        }
    }

    // 签名密钥从环境变量取；本地没有密钥时整体跳过，开发机上的 publishToMavenLocal 照常可用。
    def moduleSigningKey = providers.environmentVariable('MAVEN_GPG_KEY')
    // getOrNull() 而不是 isPresent：environmentVariable() 返回的是 Gradle 内部的
    // ValueSourceProvider，它不向 Groovy DSL 暴露 isPresent。
    def moduleCanSign = moduleSigningKey.getOrNull() != null
    signing {
        required = moduleCanSign
        if (moduleCanSign) {
            // 这里必须用 getOrElse('') 而不是 orNull。Gradle 的 useInMemoryPgpKeys 把 null
            // 口令视为"没有提供密钥"，会静默地什么都不配置 —— 随后 required=true 的签名任务
            // 在运行期报 "no configured signatory"。实测对照：
            //   useInMemoryPgpKeys(key, null) -> signatory 为 null
            //   useInMemoryPgpKeys(key, "")    -> signatory 正常
            useInMemoryPgpKeys(moduleSigningKey.get(),
                    providers.environmentVariable('MAVEN_GPG_PASSPHRASE').getOrElse(''))
        }
        // 签整个容器：插件模块的 pluginMaven 与 marker publication 创建得更晚。
        sign publishing.publications
    }

    // Groovy 版本策略按 module 区分，所以这里不统一覆盖 groovyClasspath（见各 module 的构建文件）
    tasks.withType(GroovyCompile).configureEach {
        sourceCompatibility = '17'
        targetCompatibility = '17'
        options.encoding = 'UTF-8'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    // 自定义规则要出现在 CodeNarc 的工具 classpath 上。
    // 【不对规则模块自己生效】：那样它的 codenarcMain 会依赖自身的编译产物，形成环。
    // 必须放在 afterEvaluate 里：过早添加 project 依赖会让 codenarc 配置被提前解析，
    // 那时插件还没把 CodeNarc 工具本身加进去，于是报 ClassNotFoundException: CodeNarcTask。
    afterEvaluate {
        dependencies {
            // 必须把工具【显式】写上：插件是用 defaultDependencies 添加 CodeNarc 的，
            // 而 defaultDependencies 只在配置没有任何显式依赖时才生效 ——
            // 只加规则会让工具本身被挤掉（ClassNotFoundException: CodeNarcTask）。
            codenarc "org.codenarc:CodeNarc:${codenarcVersion}"
            codenarc project.path == ':groovyfmt-codenarc'
                    // 规则模块自己：用【自己的编译产物】（不是 project(...)，那样才成环）
                    ? files(sourceSets.main.output)
                    : project(':groovyfmt-codenarc')
        }
    }
    if (project.path == ':groovyfmt-codenarc') {
        // files(sourceSets.main.output) 不带来隐式任务依赖，显式接上
        tasks.named('codenarcMain') {
            dependsOn 'classes'
        }
        tasks.named('codenarcTest') {
            dependsOn 'classes'
        }
    }

    // 规则集不排除任何格式化规则 —— 格式由 groovyfmt 产出，由 CodeNarc 独立把关
    codenarc {
        toolVersion = codenarcVersion
        configFile = rootProject.file('config/codenarc/codenarc.xml')
        reportFormat = 'text'
        maxPriority1Violations = 0
        maxPriority2Violations = 0
        maxPriority3Violations = 0
    }

    // ── SpotBugs：分析编译产物（字节码），与 CodeNarc（源码规则）互补 ──
    apply plugin: 'com.github.spotbugs'
    spotbugs {
        effort = 'max'
        reportLevel = 'low'
        // 排除规则：每条都写明实测根因，见文件内注释。
        excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
        // 阻断式：残留为 0 才翻成 false（每一条排除都在 exclude.xml 里写明依据）。
        ignoreFailures = false
    }
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html.required = true
            xml.required = true
        }
    }

    // 挂进 check：字节码级发现必须能让构建变红，否则等于没接
    tasks.named('check') {
        dependsOn 'spotbugsMain'
    }

    // 只分析源码，不含 src/test/resources 下故意写乱/非法的语料
    tasks.named('codenarcMain') {
        source = sourceSets.main.allGroovy
    }

    tasks.named('codenarcTest') {
        source = sourceSets.test.allGroovy
    }
}

def bootstrapMode = project.ext.bootstrapMode as boolean

configurations {
    formatterTool     // 已发布的固定版本（默认路径）
    groovy4           // 仅引导模式：本工程 classes + Groovy 4
}

dependencies {
    formatterTool "${project.property('projectGroup')}:groovyfmt-core:${formatterToolVersion}"
    groovy4 "org.apache.groovy:groovy:${groovyVersion}"
}

repositories {
    mavenLocal()
    mavenCentral()
}

// 所有 module 的源码。从 subprojects 派生而不是硬编码：硬编码漏掉过新模块。
// 排除 resources/，否则会把 fixtures 里故意写乱的语料也格式化掉。
def sourceTargets = { ->
    subprojects.collect { Project sub ->
        sub.fileTree('src') {
            include '**/*.groovy'
            exclude '**/resources/**'
        }
    }
}

if (!bootstrapMode) {
    // 反射而不是直接 new：Groovy 在编译期解析整个脚本，
    // 静态引用一个不在 classpath 上的类会让脚本编译失败，if 的运行时分支救不了它。
    def stepClass = Class.forName('io.github.heyuch.groovyfmt.spotless.GroovyFmtStep')
    def fmtClasspath = configurations.formatterTool.files*.absolutePath as List<String>

    spotless {
        groovy {
            target(*sourceTargets())

            // importOrder 只重排整行，由 groovyfmt 收尾统一间距（两步作用于不相交区域，可交换）
            importOrder 'java', 'javax', 'groovy', 'org.apache.groovy', 'com', 'io.github.heyuch', ''

            custom 'groovyfmt', stepClass.getConstructor(List).newInstance(fmtClasspath)

            // 同版本号重新发布时 classpath 与 fingerprint 都不变，必须手动 +1
            bumpThisNumberIfACustomStepChanges(1)
        }
    }
} else {
    // 引导模式不走 Spotless：它的步骤对象必须在【配置期】存在，而本工程产物要到【执行期】才产出。
    // 改用刚编译出的 CLI 在独立 JVM 里检查 —— 独立进程绕开 Groovy 冲突，因此不需要任何桥接类。
    def selfFiles = sourceTargets().collectMany { it.files }*.absolutePath
    def cliClasspath = files({ project(':groovyfmt-core').sourceSets.main.runtimeClasspath })

    [selfCheck: '--check', selfApply: '-w'].each { String name, String flag ->
        tasks.register(name, JavaExec) {
            group = 'verification'
            description = "引导模式自举（CLI，独立 JVM）：${flag}"
            dependsOn ':groovyfmt-core:classes'
            classpath = cliClasspath
            mainClass = 'io.github.heyuch.groovyfmt.cli.Main'
            args = [flag] + selfFiles
        }
    }
}

// ─────────────────────────── 聚合任务 ───────────────────────────
// runTests 无需聚合：Gradle 的任务名匹配会在每个含该任务的 module 里执行它。

tasks.register('formatApply') {
    group = 'verification'
    description = '用 groovyfmt 就地格式化全部源码'
    dependsOn bootstrapMode ? 'selfApply' : 'spotlessApply'
}

tasks.register('formatCheck') {
    group = 'verification'
    description = '检查全部源码是否已格式化'
    dependsOn bootstrapMode ? 'selfCheck' : 'spotlessCheck'
}

tasks.register('publishFormatter') {
    group = 'publishing'
    description = '把 formatter 发布到本地仓库（= mvn install），供自举使用'
    // 不依赖 check：首次发布时 pin 指向的版本还不存在，依赖 check 会形成死锁
    dependsOn subprojects.collect { "${it.path}:publishToMavenLocal" }
}

// 格式检查必须挂进 check，否则"源码没格式化"不会让构建失败
tasks.named('check') {
    dependsOn 'formatCheck'
}
