// Gradle 插件：把 groovyfmt 步骤自动加进 Spotless 的 groovy 扩展。
//
//   plugins { id 'com.diffplug.spotless' version '8.10.2'; id 'io.github.heyuch.groovyfmt' version '0.1.0' }
//   spotless { groovy { importOrder 'java', 'javax', 'groovy', 'com', ''; target 'src/**/*.groovy' } }
//
// 不要再自己调 addStep(GroovyFmt.step())，会得到 "Multiple steps with name 'groovyfmt'"。
plugins {
    id 'java-gradle-plugin'
    // Publishes to plugins.gradle.org. First submissions are reviewed by hand and take days;
    // that is expected, not a failure.
    id 'com.gradle.plugin-publish' version '2.2.1'
}

dependencies {
    // 步骤本体（复用，不重复实现）
    implementation project(':groovyfmt-spotless')

    // 只在编译期需要：Gradle API 由 java-gradle-plugin 提供，Spotless 由消费者自己的插件提供
    compileOnly "com.diffplug.spotless:spotless-lib:${spotlessLibVersion}"
    compileOnly "com.diffplug.spotless:spotless-plugin-gradle:${spotlessPluginVersion}"
}

gradlePlugin {
    // Portal 要求提交里带上这两个
    website = 'https://github.com/heyuch/groovyfmt'
    vcsUrl = 'https://github.com/heyuch/groovyfmt.git'

    plugins {
        groovyfmt {
            id = 'io.github.heyuch.groovyfmt'
            implementationClass = 'io.github.heyuch.groovyfmt.gradle.GroovyFmtPlugin'
            displayName = 'groovyfmt'
            description = 'Runs the groovyfmt formatter as a step inside Spotless, with no boilerplate'
            tags.set(['formatting', 'formatter', 'spotless', 'groovy', 'code-style'])

            // Portal 现在要求声明：不声明自 plugin-publish 2.1.0 起是 deprecated，
            // 未来版本会直接拒绝提交；而且一旦声明，后续版本必须继续声明。
            //
            // configurationCache 声明 false，这是实测结论而非保守取值。拿一个消费方工程
            // （应用本插件 + Spotless，跑 --configuration-cache）验过：插件的 apply() 本身
            // 没问题——第一次运行能 "Configuration cache entry stored"——但执行期报
            //
            //   Could not load the value of field `classpath` of
            //   io.github.heyuch.groovyfmt.spotless.GroovyFmtStep bean
            //
            // 因为 GroovyFmtStep 用 List.copyOf 保存 classpath，而它产生的是
            // java.util.ImmutableCollections$ListN，Gradle 的 CC 序列化器读不了这种内部类型。
            // 改成 new ArrayList<>(classpath) 后大概率就能声明 true（相等性语义不变，
            // List 的 equals 是按内容比的），但那是改 groovyfmt-spotless 的源码，不在本次范围。
            //
            // isolatedProjects 声明 false：本仓库 root build 用 subprojects{} 做跨工程配置，
            // 那是 Isolated Projects 明确不允许的。
            compatibility(it) {
                features {
                    configurationCache = false
                    isolatedProjects = false
                }
            }
        }
    }
}

// 把 core 的坐标烘焙进资源文件，保证插件版本与 formatter 版本永远一致
tasks.named('processResources') {
    filesMatching('io/github/heyuch/groovyfmt/gradle/groovyfmt.properties') {
        expand(groovyfmtCoordinate: "${project.property('projectGroup')}:groovyfmt-core:${groovyfmtVersion}")
    }
}
